name: Bump version and release

# Manually triggered: pick a semver part, and this bumps src-tauri/tauri.conf.json's
# version, commits it, tags it (vX.Y.Z), and pushes both — which in turn triggers
# release.yml (it listens for "v*" tag pushes) to actually build and draft the release.
#
# Pushing with the default GITHUB_TOKEN wouldn't trigger that downstream workflow —
# GitHub deliberately doesn't cascade workflow runs off GITHUB_TOKEN-authenticated
# pushes, to avoid accidental infinite loops — so this uses the RELEASE_PAT repo
# secret (a fine-grained PAT scoped to this repo with Contents: Read and write)
# instead, handed to checkout so every git operation after it authenticates with it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute new version
        id: version
        run: |
          current=$(jq -r .version src-tauri/tauri.conf.json)
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          new="$major.$minor.$patch"
          echo "Bumping $current -> $new (${{ inputs.bump }})"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Update tauri.conf.json
        run: |
          jq --arg v "${{ steps.version.outputs.new_version }}" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "Bump version to v${{ steps.version.outputs.new_version }}"
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.new_version }}"
