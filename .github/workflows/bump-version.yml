name: Bump version and release

# Manually triggered: pick a semver part, and this bumps src-tauri/tauri.conf.json's
# version, commits it, tags it (vX.Y.Z), and pushes both — which in turn triggers
# release.yml (it listens for "v*" tag pushes) to actually build and draft the release.
#
# Pushing with the default GITHUB_TOKEN wouldn't trigger that downstream workflow —
# GitHub deliberately doesn't cascade workflow runs off GITHUB_TOKEN-authenticated
# pushes, to avoid accidental infinite loops — so this uses the RELEASE_PAT repo
# secret (a fine-grained PAT scoped to this repo with Contents: Read and write)
# instead, handed to checkout so every git operation after it authenticates with it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  actions: read # lets the "watch the release build" step below read run status

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute new version
        id: version
        run: |
          current=$(jq -r .version src-tauri/tauri.conf.json)
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          new="$major.$minor.$patch"
          echo "Bumping $current -> $new (${{ inputs.bump }})"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Update tauri.conf.json
        run: |
          jq --arg v "${{ steps.version.outputs.new_version }}" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json
          git commit -m "Bump version to v${{ steps.version.outputs.new_version }}"
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: Watch the release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_tag="v${{ steps.version.outputs.new_version }}"
          new_sha=$(git rev-parse HEAD)
          echo "Looking for the release.yml run triggered by $new_tag ($new_sha)..."

          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh run list --repo "${{ github.repository }}" --workflow=release.yml \
              --json databaseId,headSha,event \
              -q ".[] | select(.headSha == \"$new_sha\" and .event == \"push\") | .databaseId" | head -1)
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::warning::Could not find the triggered release.yml run for $new_tag within 2.5 minutes — check the Actions tab manually."
            exit 0
          fi

          run_url="https://github.com/${{ github.repository }}/actions/runs/$run_id"
          {
            echo "### Release build for $new_tag"
            echo "[View the Release desktop app run]($run_url)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Found it: $run_url — watching..."

          # Streams the other workflow's live status into this job's own log, and
          # (--exit-status) makes this step — and so this whole job — fail if it
          # does, so one glance at "Bump version and release" tells the full story
          # instead of needing to also check release.yml separately.
          gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status
