name: Release desktop app

# Builds and publishes signed Windows/macOS/Linux installers whenever a
# "vX.Y.Z" tag is pushed — bump the version in src-tauri/tauri.conf.json
# first (it must match the tag) so the updater can tell this is newer than
# what's already installed. Creates a DRAFT GitHub Release: review the
# generated notes/assets and publish it manually — publishing is what makes
# the updater endpoint (releases/latest/download/latest.json) start serving
# this version to already-installed apps.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PMA Lyrics Studio ${{ github.ref_name }}"
          releaseBody: "Veja os arquivos abaixo para baixar e instalar esta versão."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
