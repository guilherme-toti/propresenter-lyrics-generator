name: Release desktop app

# Builds and publishes signed Windows/macOS/Linux installers whenever a
# "vX.Y.Z" tag is pushed — bump the version in src-tauri/tauri.conf.json
# first (it must match the tag) so the updater can tell this is newer than
# what's already installed. Creates a DRAFT GitHub Release, then — only if
# every platform in the matrix below built successfully — the `publish` job
# publishes it automatically. Publishing is what makes the updater endpoint
# (releases/latest/download/latest.json) start serving this version to
# already-installed apps; if any platform fails, the draft is left alone so
# a broken release never goes out silently.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            # -vv: the AppImage/linuxdeploy step has a history of failing with just
            # "failed to run linuxdeploy" and no detail at normal verbosity — see
            # commit that added this comment for the CI run that motivated it.
            args: "-vv"
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (used to build the AppImage) bundles its own copies of itself
          # and its plugins as nested AppImages, which normally self-mount via FUSE —
          # unavailable/unreliable on GitHub's ubuntu-22.04 runners even with libfuse2
          # installed above. This makes them extract-and-run instead, sidestepping FUSE
          # entirely. https://github.com/tauri-apps/tauri/issues/14796
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PMA Lyrics Studio ${{ github.ref_name }}"
          releaseBody: "Veja os arquivos abaixo para baixar e instalar esta versão."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    needs: release
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
